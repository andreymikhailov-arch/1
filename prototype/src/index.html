<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDODOM – прототип витрины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="#/">IDODOM</a>
  <nav class="nav__links" aria-label="Разделы">
    <a href="#/tables">Столы</a>
    <a href="#/sculptures">Скульптуры</a>
    <a href="#/soft">Мягкая мебель</a>
    <a href="#/beds">Кровати</a>
    <a href="#/chairs">Стулья</a>
  </nav>
  <a class="btn btn--line nav__cta" href="#/table/atlas">Собрать стол</a>
</header>
<main id="app"></main>
<footer class="foot">
  <div><span class="brand">IDODOM</span><p>Шоурум на Гранд-2. Доставка по Москве и России.</p></div>
  <p class="foot__note">Прототип для обсуждения концепции, октябрь 2026. Цены условные, заявки никуда не отправляются.</p>
</footer>
<dialog id="lead" class="lead">
  <form method="dialog" class="lead__form">
    <h2 id="lead-title">Получить расчёт</h2>
    <p class="lead__cfg" id="lead-cfg"></p>
    <label>Имя<input name="name" autocomplete="name" required></label>
    <label>Телефон или Telegram<input name="contact" autocomplete="tel" required></label>
    <label class="lead__check"><input type="checkbox" required> Согласен на обработку персональных данных</label>
    <div class="lead__actions">
      <button class="btn btn--primary" value="ok">Отправить</button>
      <button class="btn btn--ghost" value="cancel" formnovalidate>Закрыть</button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>/*JS*/</script>
</body>
</html>
